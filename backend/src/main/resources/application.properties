# Nombre de la aplicacion
spring.application.name=backend
server.port=8080

# Configuracion de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/semilleros_v2_db
spring.datasource.username=postgres
spring.datasource.password=postgresql
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA / Hibernate (Flyway gestiona el esquema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuracion de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true

# Configuracion de Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Configuracion de Spring Boot DevTools (LiveReload & Auto-restart)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Configuracion de Carga de Archivos Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Almacenamiento de Archivos y Multimedia
# En produccion: /home/semilleros (configurable por la variable de entorno APP_STORAGE_BASE_PATH)
app.storage.base-path=${APP_STORAGE_BASE_PATH:/home/semilleros}
app.upload.base-dir=uploads
app.upload.dir=uploads/semilleros

# Configuracion de Correo Electronico (Gmail / Google Workspace SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=carlosreneas@ufps.edu.co
spring.mail.password=ibdrhpsjtqlhvric
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Direccion remitente institucional predeterminada
app.mail.from=carlosreneas@ufps.edu.co

